# Harrier PCA → mMiniLM distillation defaults
bundle_dir: offline_bundle

teacher_repo: microsoft/harrier-oss-v1-0.6b
student_repo: nreimers/mMiniLMv2-L12-H384-distilled-from-XLMR-Large

pca_dim: 384
pca_fit_size: 50000
eval_mse_size: 2000
# Match student context window when encoding teacher targets
max_seq_length: 512

# Per-source unique-text caps (before global dedup)
caps:
  all_nli: 100000
  gooaq: 100000
  natural_questions: 100000
  msmarco: 100000

teacher_encode_batch_size: 256
train_batch_size: 64
# 1e-4 is fine for already-ST students; raw mMiniLM + Normalize + bf16 NaNs easily
learning_rate: 2.0e-5
num_train_epochs: 1
warmup_steps: 0.1
max_grad_norm: 1.0
# fp32 is safer for MSE+Normalize distillation on this student; set true on H100 if stable
bf16: false
fp16: false
# Training logs for TensorBoard (view with: tensorboard --logdir offline_bundle/logs/tensorboard)
report_to: tensorboard
seed: 12

nanobeir_datasets:
  - msmarco
  - nfcorpus
  - nq

hub_model_id: surya3214/mminilm-h384-distilled-harrier-pca
hub_teacher_pca_id: surya3214/harrier-pca-384
hub_pca_dataset_id: surya3214/harrier-pca-384-artifacts
